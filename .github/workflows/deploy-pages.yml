# DISABLED as of the authentication/authorization task: `next.config.ts` no
# longer sets `output: "export"` (Next.js's static export mode is
# incompatible with the Cookies/Server Actions `/admin/login` needs — see
# that file's comment and docs/DEPLOYMENT.md). `npm run build` no longer
# produces the `web/out` directory this workflow uploads, so it would fail
# on every push. Automatic triggering is turned off below (manual
# `workflow_dispatch` only) until a new host is chosen and this workflow is
# rewritten for it — see docs/DEPLOYMENT.md, "Next step: choose a host".
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
